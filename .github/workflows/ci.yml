name: CI — Testes de API

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  # ─────────────────────────────────────────────
  # JOB 1: Testes automatizados da API
  # Java + RestAssured + JUnit 5
  # ─────────────────────────────────────────────
  testes-api:
    name: Testes de API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: produtos_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:

      # ── Checkout ─────────────────────────────
      - name: Checkout do código
        uses: actions/checkout@v4

      # ── Backend ──────────────────────────────
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências do backend
        working-directory: backend
        run: npm ci

      - name: Inicializar banco de dados
        run: |
          psql \
            -h localhost \
            -U postgres \
            -d produtos_db_test \
            -f backend/src/db/init.sql
        env:
          PGPASSWORD: postgres

      - name: Subir backend
        working-directory: backend
        run: |
          npm start > backend.log 2>&1 &
        env:
          PORT: 3001
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: produtos_db_test

      - name: Aguardar API
        run: |
          echo "Aguardando backend..."

          for i in {1..30}; do
            if curl --fail http://localhost:3001/health; then
              echo ""
              echo "Backend disponível."
              exit 0
            fi

            sleep 2
          done

          echo "Backend não iniciou corretamente."
          exit 1

      # ── Java / RestAssured ───────────────────
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Executar testes RestAssured
        continue-on-error: true
        working-directory: api-tests
        run: mvn clean test
        env:
          BASE_URL: http://localhost:3001

      # ── Quality Gate ─────────────────────────
      - name: Avaliar Quality Gate
        if: always()
        working-directory: api-tests
        run: bash scripts/quality-gate.sh

      - name: Verificar arquivos gerados
        if: always()
        run: |
          echo "=== Arquivos gerados ==="
          find api-tests/target -maxdepth 2 -type f

      # ── Artefatos ────────────────────────────
      - name: Publicar resultados dos testes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-testes-api
          path: |
            api-tests/target/test-report.html
            api-tests/target/quality-gate.properties
            api-tests/target/unexpected-5xx.log
            api-tests/target/surefire-reports/
          retention-days: 7


  # ─────────────────────────────────────────────
  # JOB 2: Build das imagens
  # Executado somente se o Quality Gate for aprovado
  # ─────────────────────────────────────────────
  build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: testes-api

    steps:

      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem do backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: produtos-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build da imagem do frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: produtos-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
