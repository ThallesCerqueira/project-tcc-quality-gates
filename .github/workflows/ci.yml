name: CI — Testes de API

on:
  push:
    branches:
      - main
      - develop
      - experimento/v1-critico
      - experimento/v2-abaixo-90
      - experimento/v3-http-5xx
      - experimento/v4-nao-critico

  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:

  testes-api:
    name: Testes de API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: produtos_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:

      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências do backend
        working-directory: backend
        run: npm ci

      - name: Inicializar banco de dados
        run: |
          psql \
            -h localhost \
            -U postgres \
            -d produtos_db_test \
            -f backend/src/db/init.sql
        env:
          PGPASSWORD: postgres

      - name: Subir backend
        working-directory: backend
        run: npm start > backend.log 2>&1 &
        env:
          PORT: 3001
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: produtos_db_test

      - name: Aguardar API
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:3001/health; then
              echo "Backend disponível."
              exit 0
            fi

            sleep 2
          done

          echo "Backend não iniciou corretamente."
          exit 1

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Executar testes RestAssured
        continue-on-error: true
        working-directory: api-tests
        run: mvn clean test
        env:
          BASE_URL: http://localhost:3001
          APP_VERSION: ${{ github.ref_name }}

      - name: Avaliar Quality Gate
        if: always()
        working-directory: api-tests
        run: bash scripts/quality-gate.sh

      - name: Verificar arquivos gerados
        if: always()
        run: |
          find api-tests/target -maxdepth 2 -type f

      - name: Publicar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-testes-api-${{ github.run_number }}
          path: |
            api-tests/target/test-report.html
            api-tests/target/quality-gate.properties
            api-tests/target/unexpected-5xx.log
            api-tests/target/surefire-reports/
          retention-days: 7

      - name: Definir pasta do relatório
        if: always() && github.event_name != 'pull_request'
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME//\//-}"
          echo "REPORT_PATH=$BRANCH_NAME" >> "$GITHUB_ENV"

      - name: Preparar relatório
        if: always() && github.event_name != 'pull_request'
        run: |
          mkdir -p public
          cp api-tests/target/test-report.html public/index.html

      - name: Publicar relatório no GitHub Pages
        if: always() && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          destination_dir: ${{ env.REPORT_PATH }}
          keep_files: true


  build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: testes-api

    steps:

      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem do backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: produtos-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build da imagem do frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: produtos-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max